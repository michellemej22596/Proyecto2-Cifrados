version: '3.8'

services:
  back:
    build: 
      context: ./back
      dockerfile: Dockerfile
    container_name: cifrados_back
    ports:
      - "8000:8000"
    volumes:
      - back-data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/app.db
    restart: unless-stopped

  front:
    build: 
      context: ./front
      dockerfile: Dockerfile
    container_name: cifrados_front
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://back:8000
    depends_on:
      - back
    restart: unless-stopped

volumes:
  back-data:
